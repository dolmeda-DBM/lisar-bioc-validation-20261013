name: Experimental Intel binary source and ARM residual trace diagnosis
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact independently reviewed diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  intel:
    name: Intel original binary source counterpart and observer control only
    runs-on: macos-15-intel
    timeout-minutes: 50
    env:
      execution_priority: low
      LISAR_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LISAR_EXPECTED_ARCH: x86_64
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      NCPUS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAKEFLAGS: '-j1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - name: Exact reviewed checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_head_sha }}
      - name: Verify public native runner and unchanged candidate
        id: initialize
        run: python3 ci/runner.py initialize
      - name: Early casefold source and header-order prerequisites
        id: preflight
        run: python3 ci/probe6_native.py preflight
      - name: Pinned project R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Native R parser before installing anything
        timeout-minutes: 2
        run: Rscript --vanilla -e 'stopifnot(getRversion() == "4.6.1"); for (p in c("ci/probe3_env.R", "ci/probe6_provider.R", "ci/probe6_capture.R", "ci/probe6_capture_contract.R", "ci/probe6_smoke.R", "ci/provision.R")) parse(file=p)' > "$LISAR_VALIDATION_ROOT/probe6-R-parse.log" 2>&1
      - name: Exact small BH prerequisite
        timeout-minutes: 5
        run: Rscript --vanilla ci/probe3_env.R > "$LISAR_VALIDATION_ROOT/primitive-BH-provision.log" 2>&1
      - name: Exact nine BH header hashes and native syntax-only prerequisite
        id: header
        timeout-minutes: 3
        run: python3 ci/probe6_native.py prerequisites
      - name: Official XQuartz dependencies
        run: bash ci/install-xquartz.sh > "$LISAR_VALIDATION_ROOT/xquartz-install.log" 2>&1
      - name: Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: TinyTeX
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: Unchanged full dependency provisioning
        id: provision
        timeout-minutes: 20
        run: Rscript --vanilla ci/provision.R > "$LISAR_VALIDATION_ROOT/provision.log" 2>&1
      - name: Native observer frame defaults and return contract before any fixture
        timeout-minutes: 2
        run: python3 ci/probe6_native.py capture-contract
      - name: Exact source import derivative fresh provider and unchanged lisaR
        id: namespace
        timeout-minutes: 12
        run: python3 ci/probe6_native.py namespace
      - name: Intel original binary original48-null capture only
        id: binary
        timeout-minutes: 11
        run: python3 ci/probe6_native.py binary
      - name: Exact source counterpart trace and conditional untouched source control
        id: source
        timeout-minutes: 35
        run: python3 ci/probe6_native.py source
      - name: Preserve original diagnostic identity and all evidence
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          HEADER_OUTCOME: ${{ steps.header.outcome }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          NAMESPACE_OUTCOME: ${{ steps.namespace.outcome }}
          BINARY_OUTCOME: ${{ steps.binary.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
        run: python3 ci/probe6_native.py manifest
      - name: Upload original Intel diagnostic not a package PASS
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: residual-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LISAR_VALIDATION_ROOT }}/probe6/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  arm:
    name: ARM existing beta hypothesis original48-null actual residual trace only
    needs: intel
    # A failed prerequisite/collector on Intel must not spend a second runner.
    if: ${{ needs.intel.result == 'success' }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      execution_priority: low
      LISAR_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LISAR_EXPECTED_ARCH: arm64
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      NCPUS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAKEFLAGS: '-j1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - name: Exact reviewed checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_head_sha }}
      - name: Verify public native runner and unchanged candidate
        id: initialize
        run: python3 ci/runner.py initialize
      - name: Early casefold source and header-order prerequisites
        id: preflight
        run: python3 ci/probe6_native.py preflight
      - name: Pinned project R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Native R parser before installing anything
        timeout-minutes: 2
        run: Rscript --vanilla -e 'stopifnot(getRversion() == "4.6.1"); for (p in c("ci/probe3_env.R", "ci/probe6_provider.R", "ci/probe6_capture.R", "ci/probe6_capture_contract.R", "ci/probe6_smoke.R", "ci/provision.R")) parse(file=p)' > "$LISAR_VALIDATION_ROOT/probe6-R-parse.log" 2>&1
      - name: Exact small BH prerequisite
        timeout-minutes: 5
        run: Rscript --vanilla ci/probe3_env.R > "$LISAR_VALIDATION_ROOT/primitive-BH-provision.log" 2>&1
      - name: Exact nine BH header hashes and native syntax-only prerequisite
        id: header
        timeout-minutes: 3
        run: python3 ci/probe6_native.py prerequisites
      - name: Official XQuartz dependencies
        run: bash ci/install-xquartz.sh > "$LISAR_VALIDATION_ROOT/xquartz-install.log" 2>&1
      - name: Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: TinyTeX
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: Unchanged full dependency provisioning
        id: provision
        timeout-minutes: 20
        run: Rscript --vanilla ci/provision.R > "$LISAR_VALIDATION_ROOT/provision.log" 2>&1
      - name: Native observer frame defaults and return contract before any fixture
        timeout-minutes: 2
        run: python3 ci/probe6_native.py capture-contract
      - name: Exact source import derivative fresh provider and unchanged lisaR
        id: namespace
        timeout-minutes: 12
        run: python3 ci/probe6_native.py namespace
      - name: One unchanged48-null beta-only hypothesis with actual integer and libm trace
        id: source
        timeout-minutes: 22
        run: python3 ci/probe6_native.py source
      - name: Preserve original diagnostic identity and all evidence
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          HEADER_OUTCOME: ${{ steps.header.outcome }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          NAMESPACE_OUTCOME: ${{ steps.namespace.outcome }}
          BINARY_OUTCOME: not-applicable-ARM
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
        run: python3 ci/probe6_native.py manifest
      - name: Upload original ARM residual diagnostic not a package PASS
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: residual-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LISAR_VALIDATION_ROOT }}/probe6/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
