name: lisaR full Bioconductor readiness validation (no submission)
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact parent-reviewed commit for new full validation
        required: true
        type: string
      expected_candidate_sha256:
        description: Exact same reviewed candidate tarball
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: lisar-cross-platform-${{ inputs.expected_head_sha }}
  cancel-in-progress: false
jobs:
  native:
    name: Native ${{ matrix.platform }} full Bioconductor validation / ${{ matrix.phase }}
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - runner: ubuntu-24.04
            phase: core
            platform: linux-x86_64
            machine: x86_64
            python: python3
          - runner: macos-15-intel
            phase: core
            platform: macos-x86_64
            machine: x86_64
            python: python3
          - runner: macos-15
            phase: core
            platform: macos-arm64
            machine: arm64
            python: python3
          - runner: windows-2025
            phase: core
            platform: windows-x86_64
            machine: AMD64
            python: python
          - runner: ubuntu-24.04
            phase: ordinary-offline
            platform: linux-x86_64
            machine: x86_64
            python: python3
          - runner: ubuntu-24.04
            phase: longtests-offline
            platform: linux-x86_64
            machine: x86_64
            python: python3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      execution_priority: low
      LISAR_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LISAR_EXPECTED_ARCH: ${{ matrix.machine }}
      LISAR_VALIDATION_PHASE: ${{ matrix.phase }}
      LISAR_RUNTIME_PLATFORM: ${{ matrix.platform }}
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected_candidate_sha256 }}
      GH_TOKEN: ${{ github.token }}
      NCPUS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAKEFLAGS: '-j1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - name: Preserve committed bytes on native checkout
        run: git config --global core.autocrlf false
      - name: Exact same reviewed checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_head_sha }}
      - name: Verify native public runner, new exact candidate and oracles (no old PASS reuse)
        id: initialize
        run: ${{ matrix.python }} ci/bioc_runner.py initialize
      - name: Native macOS XQuartz
        if: ${{ runner.os == 'macOS' }}
        run: bash ci/install-xquartz.sh
      - name: Pinned native project R and Windows build tools
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: '4.6.1'
          use-public-rspm: false
          windows-path-include-rtools: true
      - name: Linux build and system dependencies
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential gfortran pkg-config libcurl4-openssl-dev libssl-dev libxml2-dev libfontconfig1-dev libharfbuzz-dev libfribidi-dev libfreetype6-dev libpng-dev libtiff-dev libjpeg-dev libuv1-dev
      - name: Pandoc for complete vignettes
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Isolated full dependency library including Shiny backend
        id: provision
        run: ${{ matrix.python }} ci/bioc_runner.py provision
      - name: Provision actual isolated TeX executables including makeindex
        id: texsetup
        if: ${{ always() && steps.provision.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py tex-setup
      - name: Native PDF manual preflight (retained independently)
        id: tex
        if: ${{ always() && steps.provision.outcome == 'success' && steps.texsetup.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py tex
      - name: Clean build with evaluated vignettes
        id: build
        if: ${{ always() && matrix.phase == 'core' && steps.provision.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py build
      - name: Clean separate installation of exact tarball
        id: install
        if: ${{ always() && matrix.phase == 'core' && steps.provision.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py install
      - name: Native parse and adversarial portability contract
        id: portable
        if: ${{ always() && steps.initialize.outcome == 'success' && steps.provision.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py portable
      - name: Native full R CMD check including manual and vignettes
        id: ordinary
        if: ${{ always() && matrix.phase == 'core' && steps.provision.outcome == 'success' && steps.portable.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py check ordinary-default
      - name: Native longtests full check on same tarball
        id: longtests
        if: ${{ always() && matrix.phase == 'core' && steps.provision.outcome == 'success' && steps.portable.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py check longtests-default
      - name: Reference check without rebuilding vignettes
        id: reference
        if: ${{ always() && matrix.phase == 'core' && steps.provision.outcome == 'success' && steps.portable.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py check reference-default
      - name: Complete online BiocCheckGitClone (exact local clone)
        id: gitclone
        if: ${{ always() && matrix.phase == 'core' && steps.provision.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py GitClone
      - name: Complete online BiocCheck (no omitted checks)
        id: bioccheck
        if: ${{ always() && matrix.phase == 'core' && steps.provision.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py BiocCheck
      - name: Full Linux check repeated in network namespace
        id: offline
        if: ${{ always() && matrix.phase == 'ordinary-offline' && steps.provision.outcome == 'success' && steps.portable.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py check ordinary-offline
      - name: Linux longtests repeated in network namespace
        id: longoffline
        if: ${{ always() && matrix.phase == 'longtests-offline' && steps.provision.outcome == 'success' && steps.portable.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py check longtests-offline
      - name: Preserve exact stage outcomes
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        env:
          BIOC_STAGE_OUTCOMES: ${{ toJSON(steps) }}
        run: ${{ matrix.python }} ci/bioc_runner.py outcomes
      - name: Preserve original diagnostics including native exits
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        run: ${{ matrix.python }} ci/bioc_runner.py collect
      - name: Upload bounded native evidence
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bioc-${{ matrix.platform }}-${{ matrix.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LISAR_VALIDATION_ROOT }}/evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
