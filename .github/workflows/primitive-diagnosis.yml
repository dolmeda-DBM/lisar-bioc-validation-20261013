name: Experimental lisaR Intel ARM primitive and one prototype diagnosis
on:
  workflow_dispatch:
    inputs:
      expected_head_sha:
        description: Exact independently reviewed diagnostic commit
        required: true
        type: string
permissions:
  contents: read
jobs:
  intel:
    name: Intel primitive reference only
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      execution_priority: low
      LISAR_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LISAR_EXPECTED_ARCH: x86_64
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      NCPUS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAKEFLAGS: '-j1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - name: Exact reviewed checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_head_sha }}
      - name: Verify native public runner and unchanged candidate
        id: initialize
        run: python3 ci/runner.py initialize
      - name: Pinned project R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Native R parser before any installation
        timeout-minutes: 2
        run: Rscript --vanilla -e 'stopifnot(getRversion() == "4.6.1"); parse(file="ci/probe3_env.R"); parse(file="ci/probe3_provider.R"); parse(file="ci/probe3_smoke.R"); parse(file="ci/provision.R")' > "$LISAR_VALIDATION_ROOT/probe3-R-parse.log" 2>&1
      - name: Only exact BH for small native primitive probe
        timeout-minutes: 5
        run: Rscript --vanilla ci/probe3_env.R > "$LISAR_VALIDATION_ROOT/primitive-BH-provision.log" 2>&1
      - name: Intel exact source primitive bits and precision dispatch
        id: primitives
        timeout-minutes: 15
        run: python3 ci/probe3_native.py primitives
      - name: Preserve original diagnostic identity and evidence
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        env:
          PRIMITIVE_OUTCOME: ${{ steps.primitives.outcome }}
          PROVISION_OUTCOME: not-applicable-light-BH-only
          NAMESPACE_OUTCOME: not-applicable-Intel
          PROTOTYPE_OUTCOME: not-applicable-Intel
        run: python3 ci/probe3_native.py manifest
      - name: Upload original Intel primitive diagnostic only
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primitive-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LISAR_VALIDATION_ROOT }}/primitive/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  arm:
    name: ARM primitives source import rebuild and one hypothesis smoke
    needs: intel
    if: ${{ always() && needs.intel.result != 'cancelled' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      execution_priority: low
      LISAR_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
      LISAR_EXPECTED_ARCH: arm64
      EXPECTED_HEAD_SHA: ${{ inputs.expected_head_sha }}
      NCPUS: '2'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MAKEFLAGS: '-j1'
      R_KEEP_PKG_SOURCE: 'yes'
    steps:
      - name: Exact reviewed checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_head_sha }}
      - name: Verify native public runner and unchanged candidate
        id: initialize
        run: python3 ci/runner.py initialize
      - name: Pinned project R
        uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
        with:
          r-version: '4.6.1'
          use-public-rspm: false
      - name: Native R parser before any installation
        timeout-minutes: 2
        run: Rscript --vanilla -e 'stopifnot(getRversion() == "4.6.1"); parse(file="ci/probe3_env.R"); parse(file="ci/probe3_provider.R"); parse(file="ci/probe3_smoke.R"); parse(file="ci/provision.R")' > "$LISAR_VALIDATION_ROOT/probe3-R-parse.log" 2>&1
      - name: Exact BH for small native primitive probe
        timeout-minutes: 5
        run: Rscript --vanilla ci/probe3_env.R > "$LISAR_VALIDATION_ROOT/primitive-BH-provision.log" 2>&1
      - name: ARM exact source primitive bits and precision dispatch
        id: primitives
        timeout-minutes: 15
        run: python3 ci/probe3_native.py primitives
      - name: Official XQuartz dependencies
        run: bash ci/install-xquartz.sh > "$LISAR_VALIDATION_ROOT/xquartz-install.log" 2>&1
      - name: Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: TinyTeX
        uses: r-lib/actions/setup-tinytex@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05
      - name: Unchanged full candidate dependency provisioning
        id: provision
        timeout-minutes: 20
        run: Rscript --vanilla ci/provision.R > "$LISAR_VALIDATION_ROOT/provision.log" 2>&1
      - name: Exact source one-symbol import remedy and fresh provider guard
        id: namespace
        timeout-minutes: 10
        run: python3 ci/probe3_native.py namespace
      - name: Exactly one unchanged48-null smoke betaMeanLog-only hypothesis
        id: prototype
        timeout-minutes: 25
        run: python3 ci/probe3_native.py prototype
      - name: Preserve original diagnostic identity source diff and outcome
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        env:
          PRIMITIVE_OUTCOME: ${{ steps.primitives.outcome }}
          PROVISION_OUTCOME: ${{ steps.provision.outcome }}
          NAMESPACE_OUTCOME: ${{ steps.namespace.outcome }}
          PROTOTYPE_OUTCOME: ${{ steps.prototype.outcome }}
        run: python3 ci/probe3_native.py manifest
      - name: Upload original ARM primitive and prototype diagnostic only
        if: ${{ always() && steps.initialize.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primitive-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LISAR_VALIDATION_ROOT }}/primitive/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
